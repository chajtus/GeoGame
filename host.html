<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOST — AGA TIMES GEOGUESSER</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── LOBBY ── */
    #screen-lobby {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 24px; padding: 32px;
    }
    #lobby-qr-wrap {
      background: var(--bg-mid); border: 2px solid var(--border);
      border-radius: 16px; padding: 20px; display: flex; flex-direction: column;
      align-items: center; gap: 12px;
    }
    #qr-code canvas, #qr-code img { border-radius: 8px; }
    .lobby-url { color: var(--primary-light); font-size: 13px; font-family: monospace; }
    #player-list {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; max-width: 700px;
    }
    .player-chip {
      background: var(--bg-mid); border: 1px solid var(--border);
      border-radius: 30px; padding: 6px 12px; display: flex;
      align-items: center; gap: 8px; font-size: 12px;
    }
    .player-chip .avatar-circle { width: 28px; height: 28px; font-size: 10px; }
    #player-count { color: var(--text-muted); font-size: 13px; }

    /* ── ROUND ── */
    #screen-round {
      flex: 1; display: flex; flex-direction: column; position: relative;
    }
    #round-photo-wrap {
      flex: 1; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: #000; max-height: calc(100vh - 160px);
    }
    /* Countdown overlay (5-4-3-2-1) */
    #host-countdown-overlay {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      z-index: 9000; pointer-events: none;
    }
    .countdown-num {
      font-weight: 900; line-height: 1; user-select: none;
      font-size: min(55vw, 65vh);
      color: rgba(255,255,255,0.10);
      text-shadow: 0 0 60px rgba(233,30,140,0.25);
      animation: cdown-pop 0.55s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes cdown-pop {
      0%  { transform: scale(1.5); opacity: 0; }
      40% { opacity: 1; }
      100%{ transform: scale(1); }
    }
    #round-photo {
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    /* TOP5 overlay */
    #top5-panel {
      position: absolute; top: 12px; right: 12px; z-index: 200;
      background: rgba(10,10,30,0.94); backdrop-filter: blur(8px);
      border: 2px solid rgba(233,30,140,0.7); border-radius: 14px;
      padding: 14px 18px; min-width: 210px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 20px rgba(233,30,140,0.15);
    }
    #top5-panel h4 { color: var(--primary-light); font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; font-weight: 800; text-transform: uppercase; }
    .top5-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
    .top5-row:last-child { margin-bottom: 0; }
    /* Answer count overlay — bigger, with names */
    #answer-count-badge {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(0,0,0,0.88); border: 1px solid rgba(233,30,140,0.35);
      border-radius: 12px; padding: 10px 14px; max-width: 300px;
    }
    #answer-count-line { font-size: 14px; font-weight: 700; color: #fff; }
    #answered-names {
      font-size: 10px; color: var(--primary-light); margin-top: 5px;
      line-height: 1.5; word-break: break-word;
    }
    /* Bottom bar */
    #round-bottom {
      background: var(--bg-panel); border-top: 2px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center; gap: 14px;
    }
    #host-timer-display {
      background: #1a0030; border: 2px solid var(--primary);
      color: var(--primary-light); padding: 8px 18px; border-radius: 8px;
      font-size: 26px; font-weight: 700; min-width: 90px; text-align: center;
      letter-spacing: 2px;
    }
    #timer-bar-wrap { flex: 1; background: var(--bg-mid); border-radius: 6px; height: 10px; overflow: hidden; }
    #timer-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 6px; transition: width 0.25s linear; }

    /* ── RESULTS ── */
    #screen-results { flex: 1; display: flex; flex-direction: column; }
    #results-map { position: absolute; inset: 0; }
    #location-label {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.88); border: 2px solid var(--primary);
      border-radius: 10px; padding: 8px 20px; text-align: center;
      white-space: nowrap; z-index: 1000; pointer-events: none;
    }
    #location-label .lbl-sub { color: var(--primary-light); font-size: 9px; letter-spacing: 1px; font-weight: 700; }
    #location-label .lbl-name { color: #fff; font-size: 15px; font-weight: 700; }
    #results-side {
      width: 300px; background: var(--bg-panel); border-left: 1px solid var(--border);
      padding: 14px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-shrink: 0;
    }
    #results-side h4 { color: var(--primary-light); font-size: 11px; letter-spacing: 1px; margin-bottom: 6px; }
    .result-row { display: flex; align-items: center; gap: 10px; background: var(--bg-mid); padding: 8px 12px; border-radius: 10px; font-size: 11px; }
    .result-row .pts { color: var(--green); font-weight: 700; font-size: 13px; margin-left: auto; white-space: nowrap; }
    .result-row .dist-label { color: var(--text-muted); font-size: 10px; margin-top: 1px; }

    /* ── LEADERBOARD ── */
    #screen-leaderboard { flex: 1; display: flex; flex-direction: column; }
    #lb-header { text-align: center; padding: 20px; background: linear-gradient(90deg, #1a0030, #3d0060); flex-shrink: 0; }
    #lb-header h1 { font-size: 22px; }
    #lb-header p { color: var(--text-muted); font-size: 11px; margin-top: 4px; }
    #podium { display: flex; justify-content: center; align-items: flex-end; gap: 20px; padding: 20px 40px 12px; flex-shrink: 0; }
    .podium-place { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .podium-avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 700; }
    .podium-bar { width: 80px; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #1a1a1a; }
    #lb-rest { flex: 1; padding: 0 40px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; overflow: hidden; align-content: start; }
    .lb-row { display: flex; align-items: center; gap: 8px; background: var(--bg-mid); padding: 6px 10px; border-radius: 8px; font-size: 11px; }
    .lb-row .lb-rank { color: var(--text-muted); min-width: 22px; }
    .lb-row .lb-pts { color: var(--text-muted); font-size: 10px; margin-left: auto; }
    .lb-row .lb-change { font-size: 10px; min-width: 20px; text-align: right; }
    .lb-row .lb-change.up { color: var(--green); }
    .lb-row .lb-change.down { color: var(--red); }

    /* ── FINALE ── */
    #screen-finale { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; position: relative; }
    #finale-video { max-width: 400px; max-height: 40vh; border-radius: 12px; }

    /* Shared bottom bars */
    .bottom-bar {
      background: var(--bg-panel); border-top: 2px solid var(--border);
      padding: 12px 20px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    .bottom-bar .btn { min-width: 200px; }
  </style>
</head>
<body>

<!-- TOP BAR (always visible) -->
<div class="top-bar" id="global-top-bar">
  <div class="logo-text">🎂 AGA TIMES GEOGUESSER</div>
  <div id="phase-label" style="color:#fff;font-size:13px;font-weight:700;"></div>
  <div id="global-stat" style="color:var(--text-muted);font-size:12px;"></div>
</div>

<!-- ===== LOBBY ===== -->
<div id="screen-lobby">
  <div id="lobby-qr-wrap">
    <div class="logo-text" style="font-size:15px;">Zeskanuj QR i dołącz!</div>
    <div id="qr-code"></div>
    <div class="lobby-url" id="lobby-url"></div>
  </div>
  <div id="player-count">Czekamy na graczy...</div>
  <div id="player-list"></div>
  <button class="btn btn--primary" id="btn-start" disabled style="min-width:240px;font-size:16px;padding:14px 32px;">
    🎮 START GRY
  </button>
  <button class="btn btn--secondary" id="btn-start-test" style="display:none;font-size:12px;padding:8px 20px;opacity:0.7;">
    🧪 TEST (1 gracz)
  </button>
</div>

<!-- ===== ROUND ===== -->
<div id="screen-round" class="hidden">
  <div id="round-photo-wrap">
    <img id="round-photo" src="" alt="Zdjęcie Agi">
    <div id="top5-panel">
      <h4>🏆 TOP 5</h4>
      <div id="top5-list"></div>
    </div>
    <div id="answer-count-badge">
      <div id="answer-count-line">✅ <span id="answer-count-num">0</span> / <span id="player-total">0</span> odpowiedziało</div>
      <div id="answered-names"></div>
    </div>
    <div id="host-countdown-overlay" class="hidden">
      <div class="countdown-num" id="host-countdown-number"></div>
    </div>
  </div>
  <div id="round-bottom">
    <div id="host-timer-display">0:30</div>
    <div id="timer-bar-wrap"><div id="timer-bar" style="width:100%"></div></div>
    <button class="btn btn--secondary" id="btn-pause">⏸ PAUZA</button>
    <button class="btn btn--success" id="btn-add-time">+5s</button>
    <button class="btn btn--danger" id="btn-end-round">⏹ ZAKOŃCZ</button>
  </div>
</div>

<!-- ===== RESULTS ===== -->
<div id="screen-results" class="hidden">
  <div style="flex:1;display:flex;min-height:0;overflow:hidden;">
    <!-- Map fills all available space -->
    <div style="flex:1;position:relative;min-width:0;">
      <div id="results-map"></div>
      <div id="location-label">
        <div class="lbl-sub">📍 PRAWDZIWE MIEJSCE</div>
        <div class="lbl-name" id="location-name-text">—</div>
      </div>
    </div>
    <!-- Side panel: photo thumbnail + scores -->
    <div id="results-side">
      <img id="results-photo-thumb" src="" alt="" style="width:100%;border-radius:8px;margin-bottom:10px;object-fit:cover;max-height:170px;display:none;">
      <h4>PUNKTY ZA RUNDĘ</h4>
      <div id="results-list"></div>
    </div>
  </div>
  <div class="bottom-bar">
    <div style="color:var(--text-muted);font-size:11px;" id="results-file-label">—</div>
    <button class="btn btn--primary" id="btn-next-question">▶ NASTĘPNE PYTANIE</button>
  </div>
</div>

<!-- ===== LEADERBOARD ===== -->
<div id="screen-leaderboard" class="hidden">
  <div id="lb-header">
    <div class="logo-text">🎂 AGA TIMES GEOGUESSER</div>
    <h1 id="lb-title">RANKING</h1>
    <p id="lb-subtitle"></p>
  </div>
  <div id="podium"></div>
  <div id="lb-rest"></div>
  <div class="bottom-bar">
    <div style="color:var(--text-muted);font-size:11px;">▲▼ zmiana pozycji względem poprzedniego leaderboardu</div>
    <button class="btn btn--primary" id="btn-after-lb">▶ PYTANIE</button>
  </div>
</div>

<!-- ===== FINALE ===== -->
<div id="screen-finale" class="hidden">
  <video id="finale-video" autoplay loop muted playsinline>
    <source src="" type="video/mp4">
  </video>
  <div id="finale-lb-wrap" style="width:100%;max-width:900px;flex:1;display:flex;flex-direction:column;"></div>
</div>

<script src="js/config.js?v=6"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script type="module" src="js/host.js?v=6"></script>
</body>
</html>
