<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AGA TIMES GEOGUESSER</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { height: 100svh; display: flex; flex-direction: column; }

    /* ═══ LOGIN ═══════════════════════════════════════════════════════════ */
    #screen-login {
      flex: 1; display: flex; flex-direction: column;
      background: #0d0d1a;
      /* reserve space for fixed button at bottom */
      padding-bottom: calc(82px + env(safe-area-inset-bottom, 20px));
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    /* HERO — full-width banner with Aga photo */
    #login-hero {
      position: relative; flex-shrink: 0;
      background: linear-gradient(160deg, #2d0055 0%, #1a0030 60%, #0d0d1a 100%);
      display: flex; align-items: center; gap: 18px;
      padding: 28px 24px 22px;
    }
    #login-hero::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
      background: linear-gradient(0deg, #0d0d1a, transparent);
    }
    #aga-avatar {
      width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
      border: 3px solid var(--primary-light); object-fit: cover;
      box-shadow: 0 0 30px rgba(233,30,140,0.7), 0 0 60px rgba(156,39,176,0.3);
    }
    #login-hero-text { display: flex; flex-direction: column; gap: 4px; }
    #screen-login .logo-text { font-size: 10px; letter-spacing: 2px; opacity: 0.8; }
    .login-title { color: #fff; font-size: 22px; font-weight: 800; line-height: 1.1; }
    .login-sub { color: var(--primary-light); font-size: 13px; margin-top: 2px; }

    /* FORM BODY */
    #login-body { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 16px; }

    /* Avatar row — horizontal to save vertical space */
    #avatar-row {
      display: flex; align-items: center; gap: 16px;
      background: var(--bg-mid); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
    }
    #avatar-preview {
      width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
      border: 2px dashed var(--border); background: #0d0d1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; overflow: hidden; cursor: pointer;
      transition: border-color 0.2s;
    }
    #avatar-preview.has-photo { border: 2.5px solid var(--primary); }
    #avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    #avatar-btns { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    #btn-selfie { width: 100%; font-size: 13px; padding: 10px 14px; }
    #btn-skip-avatar { width: 100%; font-size: 12px; padding: 8px 14px; }
    #retake-hint { color: var(--primary-light); font-size: 11px; cursor: pointer; text-decoration: underline; text-align: center; }

    /* Name field */
    .field-label { color: var(--primary-light); font-size: 10px; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 8px; display: block; }
    #name-input {
      width: 100%; background: var(--bg-mid); border: 2px solid var(--border);
      border-radius: 12px; padding: 15px 18px; color: #fff;
      font-size: 18px; font-weight: 600; outline: none;
    }
    #name-input::placeholder { color: #444; font-weight: 400; }
    #name-input:focus { border-color: var(--primary); background: #1a0a2a; }

    /* AGA FACT */
    .fact-box {
      background: rgba(233,30,140,0.07);
      border: 1px solid rgba(233,30,140,0.2); border-radius: 12px; padding: 12px 14px;
    }
    .fact-label { color: var(--primary-light); font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
    .fact-text { color: #bbb; font-size: 12px; line-height: 1.55; }

    /* FIXED JOIN BUTTON — always above nav bar */
    #login-footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 16px));
      background: linear-gradient(0deg, #0d0d1a 65%, rgba(13,13,26,0));
      pointer-events: none;
    }
    #btn-join {
      width: 100%; font-size: 18px; font-weight: 800;
      padding: 18px 24px; border-radius: 14px;
      box-shadow: 0 8px 28px rgba(233,30,140,0.5);
      pointer-events: all;
    }
    #btn-join:not(:disabled) { animation: glow-pulse 2s ease-in-out infinite; }
    #btn-join:disabled { opacity: 0.3; }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 8px 28px rgba(233,30,140,0.5); }
      50% { box-shadow: 0 8px 44px rgba(233,30,140,0.95), 0 0 0 6px rgba(233,30,140,0.1); }
    }

    /* CAMERA */
    #camera-overlay {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #camera-overlay video { width: 100%; max-height: 70vh; object-fit: cover; }
    #snap-canvas { display: none; }

    /* WAITING */
    #screen-waiting {
      flex: 1; background: linear-gradient(180deg, #1a0030 0%, var(--bg) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px;
    }
    #waiting-avatar { width: 72px; height: 72px; }
    .waiting-name { font-size: 18px; font-weight: 700; }
    .waiting-sub { color: var(--text-muted); font-size: 12px; text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MAP */
    #screen-map { flex: 1; display: flex; flex-direction: column; }
    #map-top-bar {
      background: #1a0030; padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    #round-label { color: var(--primary-light); font-size: 14px; font-weight: 800; letter-spacing: 1px; }
    #player-timer {
      background: var(--primary); color: #fff;
      padding: 8px 18px; border-radius: 14px;
      font-size: 18px; font-weight: 800; min-width: 72px; text-align: center;
      box-shadow: 0 2px 12px rgba(233,30,140,0.5);
    }
    #player-timer.urgent { background: var(--red); animation: pulse 0.5s ease-in-out infinite alternate; box-shadow: 0 2px 12px rgba(244,67,54,0.7); }
    @keyframes pulse { to { opacity: 0.65; } }
    #leader-label { color: var(--text-muted); font-size: 11px; }
    #map { flex: 1; }
    #map-hint {
      position: absolute; bottom: calc(80px + env(safe-area-inset-bottom, 16px)); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.82); color: #ccc; padding: 8px 16px;
      border-radius: 8px; font-size: 13px; white-space: nowrap; pointer-events: none; z-index: 1000;
      border: 1px solid rgba(255,255,255,0.1);
    }
    /* Submitted overlay — dims the map, keeps it visible underneath */
    #map-submitted-overlay {
      position: absolute; inset: 0; z-index: 400;
      background: rgba(5,0,20,0.78); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      padding-bottom: calc(64px + env(safe-area-inset-bottom, 16px));
    }
    #map-submitted-card {
      background: rgba(13,10,30,0.95); border: 2px solid var(--primary);
      border-radius: 22px; padding: 28px 26px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      text-align: center; width: min(340px, 88vw);
      box-shadow: 0 8px 40px rgba(233,30,140,0.3);
    }
    #overlay-check { color: var(--green); font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    #overlay-points {
      font-size: 54px; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, var(--primary-light), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #overlay-distance { color: #bbb; font-size: 15px; }
    #overlay-location { color: var(--primary-light); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    #overlay-divider { width: 50px; height: 2px; background: var(--border); border-radius: 2px; }
    #overlay-waiting { color: var(--text-muted); font-size: 13px; }
    #overlay-countdown { color: var(--primary-light); font-size: 18px; font-weight: 800; min-height: 24px; }

    /* Fixed bottom bar — always above navigation bar */
    #map-submit-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
      background: var(--bg-panel); border-top: 2px solid var(--border);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 16px));
    }
    #btn-submit { width: 100%; font-size: 17px; font-weight: 800; padding: 16px; border-radius: 14px; }
    /* Countdown overlay on map */
    #player-countdown-overlay {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      z-index: 9000; pointer-events: none;
    }
    .countdown-num {
      font-weight: 900; line-height: 1; user-select: none;
      font-size: min(55vw, 65vh);
      color: rgba(255,255,255,0.13);
      text-shadow: 0 0 60px rgba(233,30,140,0.3);
      animation: cdown-pop 0.55s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes cdown-pop {
      0%  { transform: scale(1.5); opacity: 0; }
      40% { opacity: 1; }
      100%{ transform: scale(1); }
    }

    /* SUBMITTED */
    #screen-submitted {
      flex: 1; display: flex; flex-direction: column;
      background: linear-gradient(180deg, #1a0030 0%, #0d0d1a 100%);
    }
    #submit-result-card {
      flex-shrink: 0; padding: 16px 20px 12px; display: flex; flex-direction: column;
      align-items: center; gap: 8px; text-align: center;
    }
    #submit-points {
      font-size: 52px; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, var(--primary-light), var(--gold));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #submit-distance { color: #aaa; font-size: 15px; }
    #submit-location { color: var(--primary-light); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    #submit-countdown-bar {
      display: flex; align-items: center; gap: 8px;
    }
    #submit-countdown-label { color: var(--text-muted); font-size: 11px; }
    #submit-countdown-secs { color: var(--primary-light); font-size: 16px; font-weight: 800; min-width: 36px; }
    /* Mini map fills remaining space — always visible */
    #submit-mini-map {
      flex: 1; min-height: 160px;
      margin: 0 12px 12px; border-radius: 12px;
      border: 1px solid var(--border); overflow: hidden;
    }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ROUND FLASH */
    #screen-round-flash {
      flex: 1; position: relative; background: #000;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #flash-photo {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0.6;
    }
    #flash-content {
      position: relative; z-index: 10; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px;
    }
    #flash-round-word {
      font-size: 18px; font-weight: 800; color: rgba(255,255,255,0.8);
      letter-spacing: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    #flash-round-num {
      font-size: 88px; font-weight: 900; color: #fff; line-height: 1;
      text-shadow: 0 4px 30px rgba(0,0,0,0.9), 0 0 40px rgba(233,30,140,0.6);
      animation: flash-in 0.45s cubic-bezier(0.22,1,0.36,1);
    }
    #flash-sub-text { font-size: 14px; color: var(--primary-light); margin-top: 4px; font-weight: 700; }
    @keyframes flash-in {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login">

  <!-- Hero banner -->
  <div id="login-hero">
    <img id="aga-avatar" src="assets/aga-login.jpg" alt="Aga" onerror="this.style.display='none'">
    <div id="login-hero-text">
      <div class="logo-text">🎂 AGA TIMES GEOGUESSER</div>
      <div class="login-title">Witaj w grze Agi!</div>
      <div class="login-sub">Zgadnij gdzie była 📍</div>
    </div>
  </div>

  <!-- Form -->
  <div id="login-body">

    <!-- Avatar + selfie — horizontal row -->
    <div id="avatar-row">
      <div id="avatar-preview"><span style="font-size:26px">📷</span></div>
      <div id="avatar-btns">
        <button class="btn btn--primary" id="btn-selfie">📸 ZRÓB SELFIE</button>
        <button class="btn btn--secondary" id="btn-skip-avatar">bez zdjęcia →</button>
        <small id="retake-hint" class="hidden">📸 zrób ponownie</small>
      </div>
    </div>

    <!-- Name -->
    <div>
      <label class="field-label" for="name-input">TWOJE IMIĘ</label>
      <input id="name-input" type="text" placeholder="Wpisz imię..." maxlength="20" autocomplete="off" inputmode="text">
    </div>

    <!-- AGA FACT -->
    <div class="fact-box">
      <div class="fact-label">💡 AGA FACT</div>
      <div class="fact-text" id="fact-text">Ładowanie...</div>
    </div>

  </div>

  <!-- Fixed button always above nav bar -->
  <div id="login-footer">
    <button class="btn btn--primary" id="btn-join" disabled>DOŁĄCZ DO GRY 🎮</button>
  </div>
</div>

<!-- CAMERA -->
<div id="camera-overlay" class="hidden">
  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="snap-canvas"></canvas>
  <div style="display:flex;gap:12px;">
    <button class="btn btn--primary" id="btn-snap">📸 ZRÓB ZDJĘCIE</button>
    <button class="btn btn--secondary" id="btn-cancel-camera">Anuluj</button>
  </div>
</div>

<!-- WAITING -->
<div id="screen-waiting" class="hidden">
  <div class="avatar-circle waiting-avatar" id="waiting-avatar-display" style="width:72px;height:72px;font-size:24px;font-weight:700;border:2px solid var(--primary);"></div>
  <div class="waiting-name" id="waiting-name-display"></div>
  <div class="waiting-sub">Czekamy na start gry...</div>
  <div class="spinner"></div>
</div>

<!-- ROUND FLASH (brief intro with photo + round number) -->
<div id="screen-round-flash" class="hidden">
  <img id="flash-photo" src="" alt="">
  <div id="flash-content">
    <div id="flash-round-word">RUNDA</div>
    <div id="flash-round-num">1</div>
    <div id="flash-sub-text">Gdzie to jest? 📍</div>
  </div>
</div>

<!-- MAP -->
<div id="screen-map" class="hidden" style="position:relative;">
  <div id="map-top-bar">
    <div id="round-label">RUNDA 1</div>
    <div id="player-timer">0:30</div>
    <div id="leader-label">🏆 —</div>
  </div>
  <div id="map"></div>
  <div id="map-hint">Dotknij mapę aby postawić pinezkę 📍</div>
  <!-- Submitted overlay — appears over the dimmed map after answering -->
  <div id="map-submitted-overlay" class="hidden">
    <div id="map-submitted-card">
      <div id="overlay-check">✓ ODPOWIEDŹ WYSŁANA</div>
      <div id="overlay-points">—</div>
      <div id="overlay-distance"></div>
      <div id="overlay-location"></div>
      <div id="overlay-divider"></div>
      <div class="spinner"></div>
      <div id="overlay-waiting">Czekam na innych graczy...</div>
      <div id="overlay-countdown"></div>
    </div>
  </div>
  <div id="player-countdown-overlay" class="hidden">
    <div class="countdown-num" id="player-countdown-number"></div>
  </div>
  <!-- Fixed submit bar — always visible above nav bar -->
  <div id="map-submit-bar">
    <button class="btn btn--primary" id="btn-submit" disabled>✅ ZATWIERDŹ ODPOWIEDŹ</button>
  </div>
</div>

<!-- SUBMITTED -->
<div id="screen-submitted" class="hidden">
  <div id="submit-result-card">
    <div style="color:var(--green);font-size:12px;font-weight:700;letter-spacing:1px;">✓ ODPOWIEDŹ WYSŁANA</div>
    <div id="submit-points">—</div>
    <div id="submit-distance"></div>
    <div id="submit-location"></div>
    <div id="submit-countdown-bar">
      <div class="spinner"></div>
      <div id="submit-countdown-label">Czekam na innych</div>
      <div id="submit-countdown-secs"></div>
    </div>
  </div>
  <!-- Mini map fills remaining space -->
  <div id="submit-mini-map"></div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/player.js"></script>
</body>
</html>
